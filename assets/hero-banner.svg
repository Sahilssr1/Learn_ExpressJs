<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient with animation -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #818cf8; #ec4899; #38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899; #38bdf8; #818cf8; #ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8; #a855f7; #f43f5e; #38bdf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8; #ec4899; #38bdf8; #818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6; #38bdf8; #a855f7; #f472b6" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 17px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 0.6; }
    }
    @keyframes floatBox {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; }
    .floating-box { animation: floatBox 4s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="276" rx="20" fill="url(#bgGrad)" stroke="url(#borderGlow)" stroke-width="2" />

  <!-- Background Ambient Glow Circles -->
  <circle cx="120" cy="80" r="90" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="orb-1" />
  <circle cx="780" cy="200" r="100" fill="#a855f7" opacity="0.15" filter="url(#glow)" class="orb-1" />

  <!-- Decorative Tech Dots Grid -->
  <g fill="#334155" opacity="0.3">
    <circle cx="700" cy="40" r="2" />
    <circle cx="720" cy="40" r="2" />
    <circle cx="740" cy="40" r="2" />
    <circle cx="760" cy="40" r="2" />
    <circle cx="700" cy="60" r="2" />
    <circle cx="720" cy="60" r="2" />
    <circle cx="740" cy="60" r="2" />
    <circle cx="760" cy="60" r="2" />
    <circle cx="700" cy="80" r="2" />
    <circle cx="720" cy="80" r="2" />
    <circle cx="740" cy="80" r="2" />
    <circle cx="760" cy="80" r="2" />
  </g>

  <!-- Top Category Pill -->
  <g transform="translate(60, 42)">
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#38bdf8" class="badge-text">EXPRESS.JS MASTERCLASS</text>
  </g>

  <!-- Main Hero Title -->
  <text x="60" y="118" fill="url(#textGrad)" class="title">
    Express.js Backend Mastery ⚡
  </text>

  <!-- Subtitle -->
  <text x="60" y="152" class="subtitle">
    Core Routing &bull; Dynamic Parameters &bull; Nodemon Live Reload &bull; Modern CSS Responses
  </text>

  <!-- Interactive Badges Section at Bottom -->
  <!-- Badge 1: Express -->
  <g transform="translate(60, 185)" class="floating-box">
    <rect width="170" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="20" y="26" fill="#38bdf8" class="badge-text">🚀 Express v5.x</text>
  </g>

  <!-- Badge 2: Nodemon -->
  <g transform="translate(245, 185)" class="floating-box" style="animation-delay: 0.5s;">
    <rect width="195" height="42" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.9" />
    <text x="20" y="26" fill="#10b981" class="badge-text">⚡ Nodemon Auto-Reload</text>
  </g>

  <!-- Badge 3: Modern CSS -->
  <g transform="translate(455, 185)" class="floating-box" style="animation-delay: 1s;">
    <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
    <text x="20" y="26" fill="#ec4899" class="badge-text">🎨 Modern CSS UI</text>
  </g>

  <!-- Badge 4: Clean Architecture -->
  <g transform="translate(655, 185)" class="floating-box" style="animation-delay: 1.5s;">
    <rect width="185" height="42" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <text x="20" y="26" fill="#c084fc" class="badge-text">✨ 100% Beginner Friendly</text>
  </g>
</svg>

